<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Sunrise Interior Studio</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="logo">
        <div class="logo-sun">☼</div>

        <div class="logo-text">
            <h2>SUNRISE</h2>
            <span>INTERIOR STUDIO</span>
        </div>
    </div>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="products.html">Products</a>
        <a href="gallery.html">Gallery</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact Us</a>
        <a href="quote.html" class="quote-btn">Get a Quote</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>

</header>


<!-- SIGNUP SECTION -->
<section class="login-page">

    <div class="login-container">

        <h1>Create Account</h1>

        <p>
            Join Sunrise Interior Studio and explore our interior solutions.
        </p>

        <form id="signupForm">

            <input 
                type="text" 
                id="name" 
                placeholder="Full Name" 
                required
            >

            <input 
                type="email" 
                id="email" 
                placeholder="Email Address" 
                required
            >

            <input 
                type="tel" 
                id="phone" 
                placeholder="Phone Number" 
                required
            >

            <input 
                type="password" 
                id="password" 
                placeholder="Create Password" 
                required
            >

            <input 
                type="password" 
                id="confirmPassword" 
                placeholder="Confirm Password" 
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <p id="signupMessage"></p>

        <p>
            Already have an account?
            <a href="user-login.html">Login</a>
        </p>

        <a href="login.html" class="back-home">← Back to Login</a>

    </div>

</section>


<!-- FOOTER -->
<footer>
    <p>© 2026 Sunrise Interior Studio. All Rights Reserved.</p>
</footer>


<script>
const API_URL = "http://localhost:5000";

document.getElementById("signupForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("signupMessage");

    if (password !== confirmPassword) {
        message.innerText = "Passwords do not match.";
        return;
    }

    message.innerText = "Creating your account...";

    try {
        const response = await fetch(`${API_URL}/api/auth/users/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Unable to create account");
        }

        message.innerText = "Account created. Redirecting to login...";
        setTimeout(() => {
            window.location.href = "user-login.html";
        }, 700);
    } catch (error) {
        message.innerText = error instanceof TypeError
            ? "The server is unavailable. Please start the backend and check the MongoDB connection."
            : error.message;
    }
});
</script>

    <script src="js/auth.js"></script>
    <script src="js/premium.js"></script>
</body>
</html>
