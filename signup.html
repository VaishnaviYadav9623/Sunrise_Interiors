<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Sunrise Interior Studio</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="logo">
        <div class="logo-sun">☼</div>

        <div class="logo-text">
            <h2>SUNRISE</h2>
            <span>INTERIOR STUDIO</span>
        </div>
    </div>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="products.html">Products</a>
        <a href="gallery.html">Gallery</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact Us</a>
        <a href="quote.html" class="quote-btn">Get a Quote</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>

</header>


<!-- SIGNUP SECTION -->
<section class="login-page">

    <div class="login-container">

        <h1>Create Account</h1>

        <p>
            Join Sunrise Interior Studio and explore our interior solutions.
        </p>

        <form id="signupForm">

            <input 
                type="text" 
                id="name" 
                placeholder="Full Name" 
                required
            >

            <input 
                type="email" 
                id="email" 
                placeholder="Email Address" 
                required
            >

            <input 
                type="tel" 
                id="phone" 
                placeholder="Phone Number" 
                required
            >

            <input 
                type="password" 
                id="password" 
                placeholder="Create Password" 
                required
            >

            <input 
                type="password" 
                id="confirmPassword" 
                placeholder="Confirm Password" 
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <p id="signupMessage"></p>

        <p>
            Already have an account?
            <a href="user-login.html">Login</a>
        </p>

        <a href="login.html" class="back-home">← Back to Login</a>

    </div>

</section>


<!-- FOOTER -->
<footer>
    <p>© 2026 Sunrise Interior Studio. All Rights Reserved.</p>
</footer>


<script>
document.getElementById("signupForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("signupMessage");

    if (password !== confirmPassword) {
        message.innerText = "Passwords do not match.";
        return;
    }

    message.innerText = "Account created successfully!";

});
</script>

</body>
</html>
