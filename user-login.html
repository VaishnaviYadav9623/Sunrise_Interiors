<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login - Sunrise Interior Studio</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium.css">

</head>


<body>


    <section class="login-page">

        <div class="login-container">

            <h1>User Login</h1>

            <p>Login to your account</p>


            <form id="userLoginForm">

                <input
                    type="email"
                    id="userEmail"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <div class="password-field">
                    <input
                        type="password"
                        id="userPassword"
                        placeholder="Enter your password"
                        required
                    >
                    <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                        <svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                            <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4.1-.8"></path>
                        </svg>
                    </button>
                </div>

                <br><br>

                <button type="submit">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <p>
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>


            <a href="login.html">
                ← Back
            </a>

        </div>

    </section>


    <script>
        const API_URL = "http://localhost:5000";

        document.querySelector(".password-toggle").addEventListener("click", function() {
            const passwordInput = document.getElementById("userPassword");
            const isVisible = passwordInput.type === "text";

            passwordInput.type = isVisible ? "password" : "text";
            this.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
            this.setAttribute("aria-pressed", String(!isVisible));
            this.querySelector(".password-eye").hidden = !isVisible;
            this.querySelector(".password-eye-off").hidden = isVisible;
        });

        document
            .getElementById("userLoginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const message = document.getElementById("message");
                message.innerText = "Logging in...";

                try {
                    const response = await fetch(`${API_URL}/api/auth/users/login`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: document.getElementById("userEmail").value.trim(),
                            password: document.getElementById("userPassword").value
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || "Login failed");
                    }

                    localStorage.setItem("userToken", data.token);
                    localStorage.setItem("user", JSON.stringify(data.user));
                    message.innerText = "Login successful!";

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 500);
                } catch (error) {
                    message.innerText = error instanceof TypeError
                        ? "The server is unavailable. Please start the backend and check the MongoDB connection."
                        : error.message;
                }
            });
    </script>

    <script src="js/auth.js"></script>
    <script src="js/premium.js"></script>
</body>

</html>
