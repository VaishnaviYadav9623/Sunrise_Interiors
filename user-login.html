<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login - Sunrise Interior Studio</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium.css">

</head>


<body>


    <section class="login-page">

        <div class="login-container">

            <h1>User Login</h1>

            <p>Login to your account</p>


            <form id="userLoginForm">

                <input
                    type="email"
                    id="userEmail"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <input
                    type="password"
                    id="userPassword"
                    placeholder="Enter your password"
                    required
                >

                <br><br>

                <button type="submit">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <p>
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>


            <a href="login.html">
                ← Back
            </a>

        </div>

    </section>


    <script>
        const API_URL = "http://localhost:5000";

        document
            .getElementById("userLoginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const message = document.getElementById("message");
                message.innerText = "Logging in...";

                try {
                    const response = await fetch(`${API_URL}/api/auth/users/login`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: document.getElementById("userEmail").value.trim(),
                            password: document.getElementById("userPassword").value
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || "Login failed");
                    }

                    localStorage.setItem("userToken", data.token);
                    localStorage.setItem("user", JSON.stringify(data.user));
                    message.innerText = "Login successful!";

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 500);
                } catch (error) {
                    message.innerText = error instanceof TypeError
                        ? "The server is unavailable. Please start the backend and check the MongoDB connection."
                        : error.message;
                }
            });
    </script>

    <script src="js/auth.js"></script>
    <script src="js/premium.js"></script>
</body>

</html>
