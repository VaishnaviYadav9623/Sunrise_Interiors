<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiries | Sunrise Interior Studio</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="admin-dashboard-page">

    <div class="admin-shell">
        <aside class="admin-sidebar">
            <a href="dashboard.html" class="admin-brand" aria-label="Sunrise dashboard">
                <span class="admin-brand-mark">S</span>
                <span><strong>Sunrise</strong><small>INTERIOR STUDIO</small></span>
            </a>

            <nav class="admin-nav" aria-label="Admin navigation">
                <a href="dashboard.html"><span class="admin-nav-icon">▥</span>Overview</a>
                <a href="products.html"><span class="admin-nav-icon">◇</span>Products</a>
                <a href="categories.html"><span class="admin-nav-icon">⊞</span>Categories</a>
                <a href="projects.html"><span class="admin-nav-icon">▧</span>Gallery</a>
                <a href="enquiries.html" class="active"><span class="admin-nav-icon">✉</span>Enquiries</a>
            </nav>

            <div class="admin-sidebar-footer">
                <a href="../index.html">Visit website</a>
                <button id="logoutButton" type="button"><span class="admin-nav-icon">↪</span>Sign out</button>
            </div>
        </aside>

        <div class="admin-main">
            <header class="admin-topbar">
                <p>Sunrise / Enquiries</p>
                <div class="admin-account"><span id="welcomeMessage">Sunrise Admin</span><span class="admin-account-mark">S</span></div>
            </header>

            <main class="admin-content enquiries-content">
                <section class="enquiries-heading">
                    <p class="admin-eyebrow">CLIENT LEADS</p>
                    <h1>Enquiries</h1>
                    <p>Track every website consultation request.</p>
                </section>

                <p id="enquiriesMessage" class="enquiries-message" role="status" aria-live="polite">Loading enquiries...</p>
                <section id="enquiriesPanel" class="enquiries-panel" aria-live="polite"></section>
            </main>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5000";
        const token = localStorage.getItem("adminToken");
        const enquiriesPanel = document.getElementById("enquiriesPanel");
        const enquiriesMessage = document.getElementById("enquiriesMessage");

        if (!token) {
            window.location.href = "../admin-login.html";
        }

        const adminData = localStorage.getItem("admin");
        if (adminData) {
            document.getElementById("welcomeMessage").textContent =
                JSON.parse(adminData).name || "Sunrise Admin";
        }

        function formatDate(value) {
            return new Date(value).toLocaleDateString("en-IN", {
                day: "numeric",
                month: "short",
                year: "numeric"
            });
        }

        function renderEmptyState() {
            enquiriesPanel.className = "enquiries-panel enquiries-empty-state";
            enquiriesPanel.innerHTML = `
                <span class="enquiries-empty-icon">✉</span>
                <h2>No enquiries yet.</h2>
                <p>New contact requests will appear here immediately.</p>
            `;
        }

        function renderEnquiry(contact) {
            const card = document.createElement("article");
            card.className = "enquiry-card";

            const details = document.createElement("div");
            details.className = "enquiry-details";

            const name = document.createElement("h2");
            name.textContent = contact.name;

            const subject = document.createElement("p");
            subject.className = "enquiry-subject";
            subject.textContent = contact.subject || "Website enquiry";

            const message = document.createElement("p");
            message.className = "enquiry-body";
            message.textContent = contact.message;

            const contactLine = document.createElement("p");
            contactLine.className = "enquiry-contact-line";
            contactLine.textContent = `${contact.email}${contact.phone ? ` · ${contact.phone}` : ""}`;

            details.append(name, subject, message, contactLine);

            const actions = document.createElement("div");
            actions.className = "enquiry-actions";

            const date = document.createElement("time");
            date.textContent = formatDate(contact.createdAt);

            const status = document.createElement("select");
            status.className = `enquiry-status ${contact.status}`;
            ["unread", "read", "replied"].forEach((value) => {
                const option = new Option(value[0].toUpperCase() + value.slice(1), value);
                option.selected = value === contact.status;
                status.appendChild(option);
            });

            status.addEventListener("change", () => updateStatus(contact._id, status.value, status));
            actions.append(date, status);
            card.append(details, actions);
            return card;
        }

        async function loadEnquiries() {
            try {
                const response = await fetch(`${API_URL}/api/contacts`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const contacts = await response.json();

                if (response.status === 401) {
                    localStorage.removeItem("adminToken");
                    localStorage.removeItem("admin");
                    window.location.href = "../admin-login.html";
                    return;
                }

                if (!response.ok) {
                    throw new Error(contacts.message || "Failed to load enquiries");
                }

                enquiriesMessage.textContent = `${contacts.length} entr${contacts.length === 1 ? "y" : "ies"}`;

                if (!contacts.length) {
                    renderEmptyState();
                    return;
                }

                enquiriesPanel.className = "enquiries-panel enquiry-list";
                enquiriesPanel.replaceChildren(...contacts.map(renderEnquiry));
            } catch (error) {
                enquiriesMessage.textContent = error.message;
                enquiriesPanel.className = "enquiries-panel enquiries-empty-state";
                enquiriesPanel.innerHTML = "<p>We could not load enquiries right now.</p>";
            }
        }

        async function updateStatus(id, status, select) {
            try {
                const response = await fetch(`${API_URL}/api/contacts/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ status })
                });

                if (!response.ok) {
                    throw new Error("Failed to update enquiry status");
                }

                select.className = `enquiry-status ${status}`;
            } catch (error) {
                enquiriesMessage.textContent = error.message;
                await loadEnquiries();
            }
        }

        document.getElementById("logoutButton").addEventListener("click", () => {
            localStorage.removeItem("adminToken");
            localStorage.removeItem("admin");
            window.location.href = "../admin-login.html";
        });

        loadEnquiries();
        window.setInterval(loadEnquiries, 15000);
    </script>

</body>

</html>
