
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews | Sunrise Interior Studio</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f8f5ef;
            color: #292929;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 1150px;
            margin: auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 27px;
        }

        .muted {
            color: #666;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab {
            background: #e4e4e4;
            color: #222;
        }

        .tab.active {
            background: #292929;
            color: white;
        }

        .approve {
            background: #236b45;
            color: white;
        }

        .delete {
            background: #b52e2e;
            color: white;
        }

        .refresh {
            background: #292929;
            color: white;
        }

        #status {
            margin: 15px 0;
            color: #555;
        }

        .review-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 20px;
        }

        .review-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 9px #0000000d;
            min-width: 0;
        }

        .review-card h3 {
            margin: 0 0 8px;
            overflow-wrap: anywhere;
        }

        .stars {
            color: #c28a12;
            font-size: 20px;
            margin: 10px 0;
        }

        .message {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .photos {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .photos img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .status-approved {
            color: #236b45;
            font-weight: 700;
        }

        .status-pending {
            color: #986b0a;
            font-weight: 700;
        }

        @media (max-width: 500px) {
            body {
                padding: 0;
            }

            .photos img {
                height: 130px;
            }
        }
    </style>
</head>

<body class="admin-dashboard-page">
<div class="admin-shell">
    <aside class="admin-sidebar">
        <a href="dashboard.html" class="admin-brand" aria-label="Sunrise dashboard">
            <span class="admin-brand-mark">S</span>
            <span>
                <strong>Sunrise</strong>
                <small>INTERIOR STUDIO</small>
            </span>
        </a>

        <nav class="admin-nav" aria-label="Admin navigation">
            <a href="dashboard.html"><span class="admin-nav-icon">▥</span>Overview</a>
            <a href="products.html"><span class="admin-nav-icon">◇</span>Products</a>
            <a href="categories.html"><span class="admin-nav-icon">⊞</span>Categories</a>
            <a href="projects.html"><span class="admin-nav-icon">▧</span>Projects</a>
            <a href="reviews.html" class="active"><span class="admin-nav-icon">☆</span>Customer Reviews</a>
            <a href="enquiries.html"><span class="admin-nav-icon">✉</span>Enquiries</a>
        </nav>

        <div class="admin-sidebar-footer">
            <div class="admin-sidebar-profile">
                <strong id="sidebarAdminName">Sunrise Admin</strong>
                <span id="sidebarAdminEmail">Email unavailable</span>
            </div>
            <button id="logoutButton" type="button">
                <span class="admin-nav-icon">↪</span>
                Sign out
            </button>
        </div>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <p>Sunrise / Customer Reviews</p>
            <div class="admin-account">
                <span id="welcomeMessage">Sunrise Admin</span>
                <span class="admin-account-mark">S</span>
            </div>
        </header>

        <main class="admin-content">
            <div class="page">
                <div class="topbar">
                    <div>
                        <h1>Customer Reviews</h1>
                        <div class="muted">
                            Manage customer feedback for Sunrise Interior Studio.
                        </div>
                    </div>

                    <button class="refresh" id="refreshButton">Refresh</button>
                </div>

                <div class="tabs">
                    <button class="tab active" id="pendingTab">Pending Reviews</button>
                    <button class="tab" id="allTab">All Reviews</button>
                </div>

                <p id="status" role="status">Loading reviews...</p>
                <div id="reviewList" class="review-list"></div>
            </div>
        </main>
    </div>
</div>

<script src="../js/admin-layout.js"></script>
<script>
    const API = "http://localhost:5000/api/reviews";
    const token = localStorage.getItem("adminToken");

    const reviewList = document.getElementById("reviewList");
    const statusText = document.getElementById("status");
    const pendingTab = document.getElementById("pendingTab");
    const allTab = document.getElementById("allTab");

    let currentView = "pending";

    function setStatus(message) {
        statusText.textContent = message;
    }

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                ...(options.headers || {}),
                Authorization: `Bearer ${localStorage.getItem("adminToken")}`
            }
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
            localStorage.removeItem("adminToken");
            localStorage.removeItem("admin");
            window.location.href = "../admin-login.html";
            throw new Error("Your login expired. Please log in again.");
        }

        if (!response.ok) {
            throw new Error(data.message || "Request failed.");
        }

        return data;
    }

    function createElement(tag, className, text) {
        const element = document.createElement(tag);

        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;

        return element;
    }

    function makePhotoUrl(photo) {
        if (/^https?:\/\//i.test(photo)) return photo;

        return `http://localhost:5000${
            photo.startsWith("/") ? "" : "/"
        }${photo}`;
    }

    function renderReview(review) {
        const card = createElement("article", "review-card");

        card.appendChild(createElement("h3", "", review.name || "Customer"));
        card.appendChild(
            createElement("div", "muted", review.projectType || "Interior project")
        );

        const stars = createElement(
            "div",
            "stars",
            "★".repeat(Number(review.rating) || 0) +
            "☆".repeat(5 - (Number(review.rating) || 0))
        );
        card.appendChild(stars);

        card.appendChild(
            createElement("p", "message", review.message || "")
        );

        const date = review.createdAt
            ? new Date(review.createdAt).toLocaleString()
            : "";

        card.appendChild(createElement("p", "muted", date));

        if (Array.isArray(review.photos) && review.photos.length) {
            const photos = createElement("div", "photos");

            review.photos.forEach(photo => {
                const img = document.createElement("img");
                img.src = makePhotoUrl(photo);
                img.alt = `Photo from ${review.name || "customer"}'s review`;
                img.loading = "lazy";
                img.onerror = () => {
                    img.alt = "Photo could not be loaded";
                    img.style.display = "none";
                };
                photos.appendChild(img);
            });

            card.appendChild(photos);
        }

        card.appendChild(
            createElement(
                "p",
                review.approved ? "status-approved" : "status-pending",
                review.approved ? "Approved — visible on website" : "Pending approval"
            )
        );

        const actions = createElement("div", "actions");

        if (!review.approved) {
            const approveButton = createElement("button", "approve", "Approve");

            approveButton.addEventListener("click", async () => {
                approveButton.disabled = true;

                try {
                    await apiRequest(
                        `${API}/admin/${review._id}/approve`,
                        { method: "PATCH" }
                    );

                    await loadReviews();
                } catch (error) {
                    alert(error.message);
                    approveButton.disabled = false;
                }
            });

            actions.appendChild(approveButton);
        }

        const deleteButton = createElement("button", "delete", "Delete Review");

        deleteButton.addEventListener("click", async () => {
            if (!confirm("Permanently delete this review and its uploaded photos?")) {
                return;
            }

            deleteButton.disabled = true;

            try {
                await apiRequest(`${API}/admin/${review._id}`, {
                    method: "DELETE"
                });

                await loadReviews();
            } catch (error) {
                alert(error.message);
                deleteButton.disabled = false;
            }
        });

        actions.appendChild(deleteButton);
        card.appendChild(actions);

        return card;
    }

    async function loadReviews() {
        reviewList.replaceChildren();
        setStatus("Loading reviews...");

        pendingTab.classList.toggle("active", currentView === "pending");
        allTab.classList.toggle("active", currentView === "all");

        try {
            const endpoint = currentView === "pending"
                ? `${API}/admin/pending`
                : `${API}/admin/all`;

            const reviews = await apiRequest(endpoint);

            if (!Array.isArray(reviews) || reviews.length === 0) {
                setStatus(
                    currentView === "pending"
                        ? "No pending reviews."
                        : "No reviews have been submitted yet."
                );
                return;
            }

            reviews.forEach(review => {
                reviewList.appendChild(renderReview(review));
            });

            setStatus(`${reviews.length} review(s) found.`);
        } catch (error) {
            setStatus(error.message);
        }
    }

    pendingTab.addEventListener("click", () => {
        currentView = "pending";
        loadReviews();
    });

    allTab.addEventListener("click", () => {
        currentView = "all";
        loadReviews();
    });

    document.getElementById("refreshButton").addEventListener("click", loadReviews);

    document.getElementById("logoutButton").addEventListener("click", () => {
        localStorage.removeItem("adminToken");
        localStorage.removeItem("admin");
        window.location.href = "../admin-login.html";
    });

    if (!token) {
        setStatus("Please log in as admin first.");
    } else {
        loadReviews();
    }
</script>
</body>
</html>
